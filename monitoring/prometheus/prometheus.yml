# Prometheus scrape config for VaultRun. See DEPLOY.md §10.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # The game API's Prometheus metrics (realized RTP, bets, payouts, latency, …).
  # Scraped over the internal Docker network — the API only listens on loopback,
  # so it's never scraped over the public internet.
  - job_name: vaultrun-api
    metrics_path: /metrics
    static_configs:
      - targets: ["vaultrun-api:3001"]

  # Host metrics (CPU / RAM / disk) + the backup dead-man's-switch textfile (G-3).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Prometheus monitoring itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
