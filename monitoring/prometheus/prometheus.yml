# Prometheus scrape + alerting config for VaultRun. See DEPLOY.md §10.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The game API's Prometheus metrics (realized RTP, bets, payouts, latency, …).
  # Scraped over the internal Docker network — the API only listens on loopback,
  # so it's never scraped over the public internet.
  - job_name: vaultrun-api
    metrics_path: /metrics
    # H5: /metrics is bearer-locked (MetricsAuthGuard). The token is mounted
    # read-only from the host file /etc/vaultrun/metrics-token (see
    # monitoring/docker-compose.yml) — same value as the app's METRICS_TOKEN.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["vaultrun-api:3001"]

  # Host metrics (CPU / RAM / disk) + the backup dead-man's-switch textfile.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Prometheus monitoring itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
