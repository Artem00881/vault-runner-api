# VaultRun monitoring stack — Prometheus + node-exporter + Grafana.
#
# Deploy on the VPS (from the repo root):
#   mkdir -p /etc/vaultrun/node-textfile
#   cp monitoring/.env.example monitoring/.env   # then set a Grafana admin password
#   docker compose -f monitoring/docker-compose.yml up -d
#
# Everything is bound to 127.0.0.1 — NOTHING is exposed to the public internet.
# Reach the UIs via an SSH tunnel from your Mac:
#   ssh -L 9090:127.0.0.1:9090 -L 3000:127.0.0.1:3000 root@95.179.241.145
#   then open http://localhost:9090 (Prometheus) / http://localhost:3000 (Grafana).
#
# Full docs: DEPLOY.md §10.
name: vaultrun-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: vaultrun-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # H5: bearer token to scrape the now-locked /metrics (host file, no newline).
      - /etc/vaultrun/metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # localhost only — SSH tunnel, never public
    networks:
      - monitoring
      - app # the API's network, so we can scrape vaultrun-api:3001 internally

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: vaultrun-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.textfile.directory=/textfile # backup dead-man's-switch metric (G-3)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /etc/vaultrun/node-textfile:/textfile:ro
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.4.0
    container_name: vaultrun-grafana
    restart: unless-stopped
    env_file: .env # GF_SECURITY_ADMIN_USER / _PASSWORD (gitignored)
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000" # localhost only — SSH tunnel, never public
    networks:
      - monitoring
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: vaultrun-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - monitoring # reached by Prometheus at alertmanager:9093; not exposed

networks:
  monitoring:
  app:
    external: true
    name: vault-runner-api_default # the network vaultrun-api runs on

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
