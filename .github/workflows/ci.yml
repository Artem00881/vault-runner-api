name: CI

# Run the full test suite + typecheck on every push/PR to main, and scan for
# accidentally-committed secrets. Phase 1 reliability: catch regressions and
# leaked credentials before they reach the server.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous (still-running) CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest

    # Ephemeral Postgres + Redis the test suite talks to (same shape as the
    # local docker-compose). Health-gated so tests don't start before they're up.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vaultrun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault -d vaultrun"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://vault:vault@localhost:5432/vaultrun?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      GAME_CURRENCY: DEMO
      GAME_AUTOSTART: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Apply migrations
        run: bunx prisma migrate deploy

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scan the working tree (tracked files) for hardcoded secrets. Fails the
      # job (exit 1) if anything matches, so a new leaked key blocks the merge.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --no-git --redact -v
