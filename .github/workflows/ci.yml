name: CI

# Run the full test suite + typecheck on every push/PR to main, and scan for
# accidentally-committed secrets. Phase 1 reliability: catch regressions and
# leaked credentials before they reach the server.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous (still-running) CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest

    # Ephemeral Postgres + Redis the test suite talks to (same shape as the
    # local docker-compose). Health-gated so tests don't start before they're up.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vaultrun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault -d vaultrun"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://vault:vault@localhost:5432/vaultrun?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      GAME_CURRENCY: DEMO
      GAME_AUTOSTART: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Block the merge on a HIGH/critical dependency advisory (audit H4). The one
      # remaining moderate (@nestjs/core, no 10.x fix, unreachable in our code) is
      # intentionally below the gate so it can't red-wall every build; new highs do.
      - name: Dependency audit (fail on high+)
        run: bun audit --audit-level=high

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Apply migrations
        run: bunx prisma migrate deploy

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Typecheck scripts & load (F-055 — money/reconcile/provision tooling + the load harness)
        run: bunx tsc -p tsconfig.scripts.json --noEmit

      - name: Tests
        run: bun test

      # MONEY-INVARIANT / RECONCILE GATE (audit F-018). Two layers:
      #  1. The DETERMINISTIC gate runs INSIDE `bun test` above —
      #     test/reconcile-check.test.ts builds a fresh, fully-scoped book (cashout,
      #     bust, void(refund), void(reclaim+refund), operator payout) and asserts the
      #     6 reconcile-check invariants hold (0 discrepancies) over JUST those ids, so
      #     it is reproducible on any DB (it never depends on global state). A regression
      #     that broke the money definition (e.g. a mis-typed void leg) fails the suite.
      #  2. This step is the GLOBAL belt-and-braces: on the ephemeral CI Postgres (empty +
      #     migrated, and the suites tear their rows down FK-safe) the WHOLE-DB reconcile
      #     must also net to 0. It exits non-zero on any money discrepancy, gating the merge.
      - name: Money-invariant reconcile gate (whole-DB, after the self-cleaning suite)
        run: bun scripts/reconcile-check.ts

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scan the working tree (tracked files) for hardcoded secrets. Fails the
      # job (exit 1) if anything matches, so a new leaked key blocks the merge.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --no-git --redact -v
