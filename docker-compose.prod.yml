# Vault Run — full production stack (API + Postgres + Redis).
#
# Secrets (POSTGRES_PASSWORD, JWT_SECRET, SENTRY_DSN) are NOT stored on disk.
# They are injected at deploy time from 1Password by the op-compose.sh wrapper,
# which runs `op run` to resolve the op:// references in op.prod.env and pass the
# values into this compose run as environment variables. See DEPLOY.md §12.
#
# Usage on the VPS — ALWAYS go through the wrapper so secrets are injected:
#   ./op-compose.sh up -d --build     # deploy / redeploy
#   ./op-compose.sh ps                # status
#   ./op-compose.sh logs -f api       # logs
#
# Running `docker compose -f docker-compose.prod.yml ...` directly will fail with
# "POSTGRES_PASSWORD not set" — that is the intended fail-safe (secrets missing).
services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultrun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-vault}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set - deploy via ./op-compose.sh}"
      POSTGRES_DB: "${POSTGRES_DB:-vaultrun}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault} -d ${POSTGRES_DB:-vaultrun}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vaultrun-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      # Build/version traceability (audit F-059). Forwarded to the image so /version +
      # the vaultrun_build_info metric report the running commit. Set them in the env
      # before `./op-compose.sh up -d --build` (see DEPLOY.md §5):
      #   export GIT_SHA=$(git rev-parse HEAD) BUILD_TIME=$(date -u +%FT%TZ)
      # Unset → "unknown" (identical to the prior behaviour).
      args:
        GIT_SHA: "${GIT_SHA:-unknown}"
        BUILD_TIME: "${BUILD_TIME:-unknown}"
    container_name: vaultrun-api
    restart: unless-stopped
    # No env_file — secrets come from 1Password via op-compose.sh (op run), and
    # non-secret config has safe production defaults below.
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set - deploy via ./op-compose.sh}@postgres:5432/${POSTGRES_DB:-vaultrun}?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: "3001"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET not set - deploy via ./op-compose.sh}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_RELEASE: "${SENTRY_RELEASE:-}"
      CORS_ORIGIN: "${CORS_ORIGIN:-https://vaultrun.app}"
      GAME_CURRENCY: "${GAME_CURRENCY:-DEMO}"
      WALLET_PROVIDER_TYPE: "${WALLET_PROVIDER_TYPE:-internal}"
      # Operator/real-money mode FAILS CLOSED at boot unless these RISK_* ceilings are
      # EXPLICITLY set — the code defaults are demo-grade (e.g. 1,000,000x) and become
      # the real-money backstop for any currency without per-currency betLimits. See
      # DEPLOY.md §8. UNCOMMENT + set conservative values at operator go-live (the values
      # below are EUR-reference EXAMPLES per game-math-spec §12 — review per launch):
      # RISK_MAX_BET: "10000"                 # max stake, minor units (€100 @ 2dp)
      # RISK_MAX_WIN_PER_BET: "1000000"       # max single-bet payout (€10,000)
      # RISK_MAX_MULTIPLIER: "10000"          # real-money multiplier cap (demo = 1,000,000)
      # RISK_MAX_ROUND_EXPOSURE: "10000000"   # max total potential payout per round (€100,000)
      # RISK_ALLOW_DEMO_DEFAULTS: "true"      # NON-PROD escape hatch to skip the boot guard
      OPERATOR_WALLET_TIMEOUT_MS: "${OPERATOR_WALLET_TIMEOUT_MS:-3000}"
      RESERVING_STALE_SEC: "${RESERVING_STALE_SEC:-120}"
      RESERVING_ALERT_SEC: "${RESERVING_ALERT_SEC:-600}"
      SESSION_TOKEN_TTL_SEC: "${SESSION_TOKEN_TTL_SEC:-14400}"
      THROTTLE_LIMIT: "${THROTTLE_LIMIT:-120}"
      THROTTLE_TTL_MS: "${THROTTLE_TTL_MS:-60000}"
      FAIRNESS_CHAIN_LENGTH: "${FAIRNESS_CHAIN_LENGTH:-10000}"
      SALT_PROVIDER_TYPE: "${SALT_PROVIDER_TYPE:-random}"
      FAIRNESS_REQUIRE_BLOCK_SALT: "${FAIRNESS_REQUIRE_BLOCK_SALT:-false}"
      ETH_RPC_URLS: "${ETH_RPC_URLS:-}"
      ETH_SALT_LEAD_BLOCKS: "${ETH_SALT_LEAD_BLOCKS:-128}"
      ETH_RPC_TIMEOUT_MS: "${ETH_RPC_TIMEOUT_MS:-5000}"
      # Min CONFIGURED eth RPCs the oracle will trust (audit M5). Default 2 so prod never
      # trusts a single RPC; a REAL-MONEY eth-block deploy should raise this to >=3.
      ETH_RPC_MIN: "${ETH_RPC_MIN:-2}"
      # Bearer token protecting /metrics (audit H5). Unset = open (origin is
      # Cloudflare/loopback-only); set via 1Password (op.prod.env) to lock it.
      # Prometheus sends the matching bearer (monitoring/prometheus/prometheus.yml).
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
    # Bind to loopback only — the app is NOT exposed to the public internet.
    # A host-level Caddy reverse proxy (TLS + Cloudflare Authenticated Origin
    # Pulls) terminates :443 and forwards to 127.0.0.1:3001. See DEPLOY.md
    # "Production security hardening". Never publish this on 0.0.0.0.
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
